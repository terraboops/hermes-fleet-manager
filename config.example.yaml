# config.example.yaml — hermes-fleet-manager
# Copy to config.yaml (or export as env) and fill in. Never commit secrets.
#
# Everything Terra-specific in the living system is expressed here as config,
# so the plugin is installable for any user/fleet without code changes.

registry:
  path: fleet_registry.json        # where managed sessions are tracked

# Transcript roots — one entry per Claude profile (config_dir), so any profile layout works.
profiles:
  - name: work
    config_dir: ~/.claude-work
  - name: personal
    config_dir: ~/.claude-personal

# Where signal events are pushed (the "you" the agent relays to).
relay:
  target: telegram:<chat_id>       # e.g. telegram:USER  or "local" to only log
  webhook_secret_env: FLEET_WEBHOOK_SECRET   # HMAC secret from env, never in file

# The sentinel vocabulary (regexes). DONE-/NEEDS-INPUT- are case-sensitive.
patterns:
  - '\bDONE-[A-Za-z0-9_.:-]+\b'
  - '\bNEEDS-INPUT-[A-Za-z0-9_.:-]+\b'
  - '\b[tT]raceback\b'

# Dedupe: Claude compacts/replays transcripts in place, so fired signals are
# keyed by content hash to avoid re-fire on rewrite. Keeps the last N per session.
dedupe:
  key: content_hash
  keep_per_session: 300

watch:
  interval_seconds: 5
  # Reconcile/digest: sentinels are debounced into ONE batched webhook so the handler
  # turns the firehose into a single coherent digest (not a DM per event).
  # DEBOUNCE (env FLEET_DIGEST_DEBOUNCE, default 15) = the measured burst window (~15s
  # per real traffic: events arrive in tight simultaneous bursts, then long silence).
  # MAX (env FLEET_DIGEST_MAX, default 12) = a digest LEGIBILITY ceiling, not a timing
  # knob (a digest much past ~12 lines stops being a digest).
  # PERSISTENT (pending_file): buffered events are written to disk so a daemon restart
  # resumes + flushes them instead of losing the batch. Urgent (NEEDS-INPUT-/traceback)
  # flush immediately.

# Sentinel namespace: fleet_watch.slug holds the per-daemon-run random slug.
# Dispatches must emit DONE-<slug>-<session>-<ms>; matching is exact + case-sensitive.
slug_file: ~/.hermes/scripts/cc-watch/fleet_watch.slug
