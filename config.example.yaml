# config.example.yaml — hermes-fleet-manager
# Copy to config.yaml (or export as env) and fill in. Never commit secrets.
#
# Everything environment-specific in the living system is expressed here as config,
# so the plugin is installable for any user/fleet without code changes.

registry:
  path: fleet_registry.json        # where managed sessions are tracked

# Transcript roots — one entry per Claude profile (config_dir), so any profile layout works.
profiles:
  - name: work
    config_dir: ~/.claude-work
  - name: personal
    config_dir: ~/.claude-personal

# Where signal events are pushed (the "you" the agent relays to).
relay:
  target: telegram:<chat_id>       # e.g. telegram:USER  or "local" to only log
  webhook_secret_env: FLEET_WEBHOOK_SECRET   # HMAC secret from env, never in file

# Sentinel tokens. The daemon applies slug-namespaced tokens (DONE-<slug>-<session>-<ms>,
# NEEDS-INPUT-<slug>-<session>-<what>) AND generic session-lifetime forms, all matched
# exact + case-sensitive + whole-token, only on model-emitted lines. The per-run random
# slug lives in slug_file below; dispatch tokens must use it.

# Dedupe: Claude compacts/replays transcripts in place, so fired signals are
# keyed by content hash to avoid re-fire on rewrite. Keeps the last N per session.
dedupe:
  key: content_hash
  keep_per_session: 300

watch:
  interval_seconds: 5
  # STALL detection (alive-but-silent): how many seconds of no new transcript before a
  # STALL-<session> CHECK-IN fires. Fast (30s default). A STALL is just a prompt to check
  # in on the session and ask WHY it's quiet — a legit external wait (API down, rate
  # limit, dependency/approval) is fine; only escalate to the user when the agent has no
  # good reason and there is further work available (there always is).
  stall_window_seconds: 120  # seconds of silence before a STALL check-in fires (2m default; runtime-overridable via FLEET_CONFIG JSON key "stall_window")
  # Delivery-ACK: confirm a dispatch actually landed as a USER turn (pane-visibility is NOT proof).
  #   arm before dispatching: fleet_watch.py watch ack --session <s> --marker <m> --deadline-min <0.7>
  #   daemon satisfies when the marker appears as a real user turn, else fires ACK-MISSED (urgent).
  ack_file: ~/.hermes/scripts/cc-watch/fleet_watch_acks.json
  # User-message buffer: the daemon holds the last hour of real user-role turns per session so the
  # agent can answer "what was this session told?" with one query — `fleet_watch.py user-lines
  # --session <s> [--minutes N]` (user messages Terra dispatched/remotely-sent + the session's own
  # scheduled sweeps; pane-swallowed dispatches never land here, which is the delivery truth).
  user_msgs_file: ~/.hermes/scripts/cc-watch/fleet_user_msgs.json
  # Reconcile/digest: sentinels are debounced into ONE batched webhook so the handler
  # turns the firehose into a single coherent digest (not a DM per event).
  # DEBOUNCE (env FLEET_DIGEST_DEBOUNCE, default 15) = the measured burst window (~15s
  # per real traffic: events arrive in tight simultaneous bursts, then long silence).
  # MAX (env FLEET_DIGEST_MAX, default 12) = a digest LEGIBILITY ceiling, not a timing
  # knob (a digest much past ~12 lines stops being a digest).
  # PERSISTENT (pending_file): buffered events are written to disk so a daemon restart
  # resumes + flushes them instead of losing the batch. Urgent (NEEDS-INPUT-/traceback)
  # flush immediately.

# Sentinel namespace: fleet_watch.slug holds the per-daemon-run random slug.
# Dispatches must emit DONE-<slug>-<session>-<ms>; matching is exact + case-sensitive.
slug_file: ~/.hermes/hermes-fleet-manager/fleet_watch.slug
