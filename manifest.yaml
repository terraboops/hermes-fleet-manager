# manifest.yaml — hermes-fleet-manager (dir-plugin manifest)
# NOTE: field names follow the Hermes dir-plugin spec; adjust to the exact
# manifest schema in use before release (schema verification is part of the
# review checklist).
name: hermes-fleet-manager
version: 0.1.0
description: >
  Supervise a fleet of Claude Code sessions. Config-driven watcher daemon,
  session registry, sentinel protocol (DONE-/NEEDS-INPUT-/traceback), and a
  managed-member skill injected into Claude profiles.

# Tools this plugin provides (registered as Hermes tools)
tools:
  - fleet.register
  - fleet.unregister
  - fleet.list
  - fleet.check

# Skills this plugin provides to Hermes sessions
skills:
  - fleet-member

# Long-lived daemon this plugin can surface for management
daemon:
  command: python3 fleet_watch.py
  flags: ["--daemon", "--interval", "5"]
