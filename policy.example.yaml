# Escalation policy overrides. Copy to ~/.hermes/cache/fleet-funnel/policy.yaml (or point FLEET_POLICY at it).
# Every key is optional; a missing key keeps the default in policy.py. The daemon re-reads the file when
# it changes, so no restart is needed. A broken file means the defaults, never a crash.
#
# ASK (page):   hard-floor asks (irreversible, outward, money, credentials) and classifier blocks.
# DECIDE:       a reversible continue/choice ask is answered and logged to decisions_log.
# INFORM:       dead, usage limit, crash, stall: news, never a question.

stall_inform_after_s: 600                   # a stall shorter than this is not news
decisions_log: ~/notes/decisions.md
acted_window_hours: 24                      # weekly report: a page counts as acted on if the operator wrote to the session within this window
hard_prefixes: [SESSION-DEAD-, USAGE-LIMIT-, NO-TRANSCRIPT-]
classifier_blocks: '\[(Production Deploy|Security Weaken|Self-Approval|Git Destructive)\]'
status_repeat_window_s: 604800              # a "still blocked, nothing changed" restatement of a paged hold waits this long (7 days)
# idle_status: <regex>                      # idle / no-change markers; with no question mark and no credential or owner words, a status loop is silent
# ask_signal: <regex>                       # any sign the session wants something; none of these = progress narration, silent
# hard_supply: <regex>                      # credential, money or access words: never silenced
# owner_held: <regex>                       # "waits on the operator" shapes: never silenced
# irreversible: <regex>                     # steps the fleet may never answer for her
# choice: <regex>                           # shapes treated as a two-way choice
# continue_ask: <regex>                     # shapes treated as "may I continue"
continue_reply: >-
  Yes, continue. Stay on the registered goal and keep every step reversible. If a step would delete,
  deploy, spend, touch credentials, widen access or message someone outside the house, stop and emit
  NEEDS-INPUT naming that step.
inform:
  session_dead: "{session} is dead and not running. {detail}Parked and logged; nothing to decide unless you want it revived."
  usage_limit: "{session} hit a usage or credit limit and is waiting for it to reset. {detail}Nothing to decide."
  crash: "{session} crashed in its own output. {detail}Logged with the session; nothing to decide unless you want it looked at."
  no_safe_nudge: "{session} has been stopped for {mins} min. {detail}Prompts are not landing; it stays parked and is listed in the weekly review."
  nudge_refused: "{session} has been stopped for {mins} min after every prompt was tried. {detail}It stays parked and is listed in the weekly review."
  no_transcript: "{session} is registered but has no transcript. {detail}Logged; nothing to decide."
